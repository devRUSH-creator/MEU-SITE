<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO DE SITE</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #111;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background-color: #111;
            color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #0b6cf5;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 6px 16px rgba(11, 108, 245, 0.25);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(11, 108, 245, 0.35);
            background-color: #0953c1;
        }

        button:active {
            transform: translateY(0);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conheça um pouco do meu trabalho</h1>
        <p>O mundo é seu, busque conquistar!</p>
        <img src="https://i.pinimg.com/736x/0f/8d/9d/0f8d9d9eee0b90cbc2b3819accf26241.jpg" alt="Imagem inspiradora">
        <h2>Viva hoje e conquiste!</h2>
        <button id="themeButton">Tema Escuro</button>
    </div>

    <section class="container">
        <h1>Me chamo Joaquim Andrade Evangelista</h1>
        <p>Futuro programador e desenvolvedor Web.</p>
        <p>Tenho 17 anos e sigo na minha carreira estudando para alcançar meus objetivos.</p>
    </section>

    <script>
        const button = document.getElementById('themeButton');
        button.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const themeIsDark = document.body.classList.contains('dark');
            button.textContent = themeIsDark ? 'Tema Claro' : 'Tema Escuro';
            button.classList.add('fx-activate');
        });
    </script>
</body>
</html>
